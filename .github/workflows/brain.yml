name: Brain

on:
  pull_request:
    paths:
      - workers/brain/**
      - .github/workflows/brain.yml
  push:
    branches: [main]
    paths:
      - workers/brain/**
      - .github/workflows/brain.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/brain

concurrency:
  group: brain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/brain/.node-version
          cache: npm
          cache-dependency-path: workers/brain/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
