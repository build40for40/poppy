name: Brain

# No path filter: landing/index.html is bundled into the Worker, so a change outside workers/brain can change what is live.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/brain

# A newer push to a pull request replaces its run. A run called from the deploy workflow gets a group of its own, so every commit on main is checked.
concurrency:
  group: brain-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/brain/.node-version
          cache: npm
          cache-dependency-path: workers/brain/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
