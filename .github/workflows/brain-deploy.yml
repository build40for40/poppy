name: Brain deploy

# Manual only until a provider's secrets exist (Meta's, or Twilio's as the fallback). Once they do, add a push trigger on main for workers/brain/**.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/brain

concurrency:
  group: brain-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to build40for40.com/poppy/api
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/brain/.node-version
          cache: npm
          cache-dependency-path: workers/brain/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: List the Worker secrets that are set
        id: secrets
        run: |
          {
            echo "names<<EOF"
            [ -n "$ANTHROPIC_API_KEY" ] && echo ANTHROPIC_API_KEY
            [ -n "$WHATSAPP_APP_SECRET" ] && echo WHATSAPP_APP_SECRET
            [ -n "$WHATSAPP_TOKEN" ] && echo WHATSAPP_TOKEN
            [ -n "$WHATSAPP_VERIFY_TOKEN" ] && echo WHATSAPP_VERIFY_TOKEN
            [ -n "$WHATSAPP_PHONE_NUMBER_ID" ] && echo WHATSAPP_PHONE_NUMBER_ID
            [ -n "$TWILIO_ACCOUNT_SID" ] && echo TWILIO_ACCOUNT_SID
            [ -n "$TWILIO_AUTH_TOKEN" ] && echo TWILIO_AUTH_TOKEN
            [ -n "$TWILIO_WHATSAPP_FROM" ] && echo TWILIO_WHATSAPP_FROM
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/brain
          secrets: ${{ steps.secrets.outputs.names }}
          command: deploy

      - name: Skip deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy skipped because the CLOUDFLARE_API_TOKEN secret isn't set."
